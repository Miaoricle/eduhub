name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - name: Seed command runs on a fresh database
        run: python manage.py migrate -v0 && python manage.py seed_data
      - name: Production settings refuse to start without a secret
        run: |
          if DJANGO_DEBUG=0 python manage.py check 2>/dev/null; then echo "should have failed"; exit 1; fi
          DJANGO_DEBUG=0 DJANGO_SECRET_KEY=ci-only-key-$(date +%s)-0123456789abcdef python manage.py check
