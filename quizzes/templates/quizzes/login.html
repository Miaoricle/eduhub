{% extends "quizzes/base.html" %}
{% block title %}Login - EduHub{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 p-md-5">
      <h1 class="h4 mb-4">Log in</h1>
      {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" autocomplete="username" autofocus required></div>
        <div class="mb-3"><label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" autocomplete="current-password" required></div>
        <button class="btn-ink btn w-100">Log in</button>
      </form>
      <p class="text-muted mt-3 mb-0">No account yet? <a href="{% url 'register' %}">Create a student account</a></p>
    </div>
  </div>
</div>
{% endblock %}
