{% extends "quizzes/base.html" %}
{% block title %}Login - EduHub{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 p-md-5 fade-up">
      <h4 class="text-center mb-4"><i class="bi bi-box-arrow-in-right" style="color:var(--brand-1)"></i> Welcome back</h4>
      {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" autofocus required></div>
        <div class="mb-3"><label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required></div>
        <button class="btn-grad btn w-100">Login</button>
      </form>
      <p class="text-center text-muted mt-3 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
